<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HubWallet · Guest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="row">
    <div class="grow">
      <span class="label">HubWallet · your wallet</span>
      <h1 id="hub-name">Connecting…</h1>
    </div>
    <button id="refresh" type="button">Refresh</button>
  </header>

  <section class="stats" aria-label="Your wallet">
    <div class="stat"><div class="label">Dollars</div><div class="v" id="dollars">–</div><div class="small muted" id="dollar-ticker">HUSD</div></div>
    <div class="stat"><div class="label">Bitcoin for fees</div><div class="v" id="sats">–</div><div class="small muted">sats</div></div>
  </section>

  <section id="keys" aria-label="Your keys"></section>

  <section class="card" id="tracking" hidden aria-live="polite">
    <div class="row"><h2 class="grow" id="track-title">Payment</h2><span id="track-link"></span></div>
    <ol class="steps" id="track-steps"></ol>
    <div id="track-msg"></div>
  </section>

  <section class="card">
    <div class="row"><h2 class="grow">Here</h2><span class="small muted" id="hub-url"></span></div>
    <div id="services" class="row" style="flex-direction:column;align-items:stretch"></div>
  </section>

  <p class="small muted">Your keys and dollars stay in your own wallet. The home only asks for a payment and checks that it arrived, over RGB on Bitcoin (Mutinynet test network).</p>
</div>
<script src="guest.js" type="module"></script>
</body>
</html>
