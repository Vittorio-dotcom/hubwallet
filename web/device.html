<!doctype html>
<!-- HubWallet device screen: stands in for the physical device in the demo (washing machine, dryer).
     Served by the hub (src/hub.js serves web/). Open /device.html?id=<serviceId>; without id it lists the devices.
     It only READS the public hub API (/api/hub/info, /api/services): it cannot start or pay anything.
     Optional: &guest=<guest app URL> for the QR code (default http://127.0.0.1:8090/guest.html). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try { const t = localStorage.getItem('hw-theme'); if (t) document.documentElement.dataset.theme = t } catch {}</script>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>HubWallet Device</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="liquid-glass.css">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
</head>
<body class="screen-body liquid-glass-backdrop">
<main class="screen" id="screen" aria-live="polite"></main>
<script src="device.js" type="module"></script>
</body>
</html>
